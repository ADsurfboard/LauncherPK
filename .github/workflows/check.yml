name: 核对启动器数据
run-name: 核对启动器数据

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 对照 GitHub 检查
        run: node scripts/check.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
